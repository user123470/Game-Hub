<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Library</title>
<link rel="preconnect" href="https://radiantoptimizer.app">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ========== LOGIN (TANPA TEKS) ========== -->
<div id="gate">
  <div class="gate-card">
    <div class="gate-logo">⚡</div>
    <input type="password" id="pw" autocomplete="off" autofocus>
    <button id="loginBtn" type="button">ENTER</button>
    <p id="err" class="err"></p>
  </div>
</div>

<!-- ========== APP ========== -->
<div id="app" class="hidden">
  <header class="topbar">
    <div class="brand">
      <span class="brand-icon">⚡</span>
    </div>

    <div class="search-wrap">
      <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <circle cx="11" cy="11" r="8"></circle>
        <path d="m21 21-4.3-4.3"></path>
      </svg>
      <input type="text" id="search" placeholder="Cari game..." autocomplete="off">
    </div>
  </header>

  <main>
    <div class="meta">
      <span id="count">Memuat...</span>
    </div>

    <div id="chips" class="chips"></div>

    <div id="grid" class="grid"></div>

    <div id="empty" class="empty hidden">
      <div class="empty-icon">🔍</div>
      <p>Tidak ada game yang cocok dengan pencarianmu.</p>
    </div>
  </main>

  <footer>
    <p>Private collection · <span id="totalFoot"></span> game</p>
  </footer>
</div>

<script src="app.js"></script>
</body>
</html>
