<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memuat game...</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="player-body">

<div class="player-bar">
  <a href="index.html" class="player-btn" id="backBtn">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    <span>Kembali</span>
  </a>
  <div class="player-title" id="playerTitle">Memuat...</div>
  <a id="openNewTab" class="player-btn" target="_blank" rel="noopener">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
    <span>Tab Baru</span>
  </a>
</div>

<div class="player-wrap">
  <div id="loading" class="player-loading">
    <div class="spinner"></div>
    <p>Memuat game...</p>
    <small>Jika tidak muncul dalam 6 detik, akan ada tombol alternatif.</small>
  </div>

  <iframe id="gameFrame" class="game-frame hidden" allowfullscreen
    allow="autoplay; fullscreen; gamepad; microphone; camera; clipboard-write"></iframe>

  <div id="fallback" class="player-fallback hidden">
    <div class="fallback-icon">🚫</div>
    <h2>Game tidak bisa di-embed</h2>
    <p>Situs ini melarang dijalankan di dalam website lain.</p>
    <a id="fallbackBtn" class="fallback-btn" target="_blank" rel="noopener">
      Buka di Tab Baru
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
    </a>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
